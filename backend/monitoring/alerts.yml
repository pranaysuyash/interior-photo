groups:
  - name: interior_ai_alerts
    interval: 30s
    rules:
      # API Health Alerts
      - alert: APIDown
        expr: up{job="interior-ai-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Interior AI API is down"
          description: "The API has been down for more than 2 minutes."

      - alert: HighAPIResponseTime
        expr: http_request_duration_seconds{quantile="0.95"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response time detected"
          description: "95th percentile response time is above 3 seconds."

      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API error rate is above 5% for the last 5 minutes."

      # Database Alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection count"
          description: "Database has more than 80 active connections."

      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_statements_mean_exec_time[5m]) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "Average query execution time is above 1 second."

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using more than 90% of allocated memory."

      # Celery Worker Alerts
      - alert: CeleryWorkersDown
        expr: celery_workers_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No active Celery workers"
          description: "All Celery workers are down or not responding."

      - alert: HighCeleryQueueSize
        expr: celery_tasks_waiting > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High Celery queue size"
          description: "More than 100 tasks are waiting in the queue."

      - alert: CeleryTaskFailureRate
        expr: rate(celery_tasks_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate"
          description: "Task failure rate is above 10%."

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for the last 10 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for the last 10 minutes."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Available disk space is below 15%."

      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space"
          description: "Available disk space is below 5%."

      # Application-specific Alerts
      - alert: HighTransformationFailureRate
        expr: rate(transformations_failed_total[10m]) / rate(transformations_total[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transformation failure rate"
          description: "More than 20% of transformations are failing."

      - alert: LongRunningTransformations
        expr: transformation_processing_time_seconds{quantile="0.95"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Long-running transformations detected"
          description: "95th percentile transformation time is above 5 minutes."

      - alert: UserCreditsExhausted
        expr: sum(user_credits_exhausted_total) > 10
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Multiple users running out of credits"
          description: "More than 10 users have exhausted their credits in the last hour."
